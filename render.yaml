# Render Blueprint - Phase 5 Todo Backend
# Deploy: https://dashboard.render.com/ → New → Blueprint → Connect this repo

services:
  - type: web
    runtime: python
    name: phase5-todo-api
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://phase5-todo-app.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: phase5-todo-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: phase5-todo-db
    plan: free
