version: "3.8"

services:
  # ---------- Redpanda (Kafka-compatible, local, zero payment) ----------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redpanda Console (optional UI, free) ----------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------- Backend (FastAPI + Dapr sidecar) ----------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: todo-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-key-change-in-prod}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock}
      MOCK_MODE: "true"
      AI_MODEL: ${AI_MODEL:-openai}
      DAPR_HTTP_PORT: "3500"
    volumes:
      - ./backend:/app
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo-net

  # ---------- Dapr sidecar for backend ----------
  backend-dapr:
    image: "daprio/daprd:1.13.4"
    container_name: backend-dapr
    command:
      [
        "./daprd",
        "-app-id", "todo-backend",
        "-app-port", "8000",
        "-dapr-http-port", "3500",
        "-dapr-grpc-port", "50001",
        "-resources-path", "/components",
        "-log-level", "info",
      ]
    volumes:
      - ./dapr/components:/components
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # ---------- Frontend (Next.js) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: todo-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_URL: http://backend:8000
    restart: unless-stopped
    networks:
      - todo-net

volumes:
  redpanda_data:

networks:
  todo-net:
    driver: bridge
