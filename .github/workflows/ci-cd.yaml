name: CI/CD — Phase V Todo App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/todo-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/todo-frontend

jobs:
  # ---------------------------------------------------------------- Lint & Test
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: python -m ruff check app/ --ignore E501

      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret"
          MOCK_MODE: "true"
        run: python -m pytest tests/ -v --tb=short

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
        run: npm run build

  # ---------------------------------------------------------------- Docker Build
  build-images:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ---------------------------------------------------------------- Deploy to DOKS
  deploy:
    name: Deploy to DOKS
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Install Dapr on cluster (idempotent)
        run: |
          helm repo add dapr https://dapr.github.io/helm-charts/ || true
          helm repo update
          helm upgrade --install dapr dapr/dapr --namespace dapr-system --create-namespace --wait

      - name: Deploy todo-app via Helm
        run: |
          helm upgrade --install todo-app ./charts/todo-app \
            --namespace default \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set secrets.dbConnectionString="${{ secrets.DATABASE_URL }}" \
            --set secrets.secretKey="${{ secrets.SECRET_KEY }}" \
            --set secrets.openaiApiKey="mock" \
            --wait --timeout 300s

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/todo-backend --timeout=120s
          kubectl rollout status deployment/todo-frontend --timeout=120s
          kubectl get pods -l app.kubernetes.io/name=todo-backend
          kubectl get pods -l app.kubernetes.io/name=todo-frontend
