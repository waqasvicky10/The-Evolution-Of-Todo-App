{{- if .Values.backend.dapr.enabled }}
---
# Pub/Sub — Redpanda (Kafka-compatible)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: task-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "{{ .Release.Name }}-redpanda:9092"
    - name: consumerGroup
      value: "todo-app-group"
    - name: authType
      value: "none"
  scopes:
    - todo-backend
---
# State Store — Neon PostgreSQL
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: task-statestore
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: db-secret
        key: connection-string
    - name: tableName
      value: "dapr_state"
    - name: metadataTableName
      value: "dapr_metadata"
  auth:
    secretStore: kubernetes
  scopes:
    - todo-backend
---
# Input Binding — Cron for reminders
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: reminder-cron
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "@every 5m"
    - name: direction
      value: "input"
  scopes:
    - todo-backend
---
# Secret Store — Kubernetes Secrets
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
{{- end }}
